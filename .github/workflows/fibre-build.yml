name: Food You Fibre test build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/fibre-summary]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FoodYouFibre-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
